$schema: "https://moonrepo.dev/schemas/tasks.json"

tasks:
  build:
    command: "bun run build"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
    outputs:
      - "dist/**/*"

  dev:
    command: "bun run dev"
    options:
      persistent: true

  lint:
    command: "bunx biome lint --no-errors-on-unmatched ./src"
    inputs:
      - "src/**/*.{ts,tsx,js,jsx}"

  format:
    command: "bunx biome format --no-errors-on-unmatched ./src"
    inputs:
      - "src/**/*.{ts,tsx,js,jsx,json}"

  typecheck:
    command:
      - bash
      - -lc
      - "if find . -type f -name \"*.ts\" -print -o -type f -name \"*.tsx\" -print | head -1 | grep -q .; then bunx tsc --noEmit; else echo 'No TypeScript sources found; skipping typecheck.'; fi"
    inputs:
      - "src/**/*.{ts,tsx}"

  test:
    command: "bunx vitest run"
    inputs:
      - "src/**/*"
      - "test/**/*"
